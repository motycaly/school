function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return'x'+h}}
const hashPw=(salt,pw)=>sha(salt+':'+pw),newSalt=()=>uid()+uid();
async function put(c,id,d){try{await db.collection(c).doc(id).set(d);return true}catch(e){toast('⚠️ Не получилось сохранить: нет прав или нет связи');return false}}
async function del(c,id){try{await db.collection(c).doc(id).delete();return true}catch(e){toast('⚠️ Не удалось удалить');return false}}
async function putSecret(nick,pw){const ref=db.collection('secrets').doc(myId),f={[sk(nick)]:{nick,pw,ts:Date.now()}};const g=await ref.get();if(g.exists)await ref.update(f);else await ref.set(f)}
async function setPw(nick,pw){const salt=newSalt(),hash=await hashPw(salt,pw);if(!(await put('auth',nick,{salt,hash})))return false;try{await putSecret(nick,pw)}catch(e){}return hash}
async function canSetup(){if(window.FB_CFG)return true;try{const us=await claude.use('user');return !!us&&await us.canEdit()}catch(e){return false}}

async function shrink(file){try{const bm=await createImageBitmap(file),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return (await new Promise(r=>c.toBlob(r,'image/jpeg',.85)))||file}catch(e){return file}}

const mapUrl=()=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(placeOf());
const closedNow=()=>{const s=site();return !!s.closed&&(!s.until||Date.now()<s.until)};
function cdText(){const s=site();if(!s.until)return'Сайт откроется, когда администрация завершит работы.';const ms=s.until-Date.now();if(ms<=0)return'Скоро откроемся…';const t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),c=t%60;return'Откроется через '+(h?h+' ч ':'')+String(m).padStart(2,'0')+' мин '+String(c).padStart(2,'0')+' с (в '+new Date(s.until).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+')'}
const editF=t=>t.role==='student'?`<form data-f="setinfo" data-nick="${esc(t.nick)}" class="row2" style="margin-bottom:6px"><input name="cls" value="${esc(t.cls||'')}" placeholder="класс" style="width:80px"><button class="s ok">Класс</button></form>`:t.role==='teacher'?`<form data-f="setinfo" data-nick="${esc(t.nick)}" class="row2" style="margin-bottom:6px"><input name="subject" value="${esc(t.subject||'')}" placeholder="предмет" style="width:130px"><button class="s ok">Предмет</button></form>`:'';
const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})};
function countUp(){if(reduced)return;document.querySelectorAll('.stat b').forEach(b=>{const t=b.textContent.trim();if(!/^\d+(\.\d+)?$/.test(t))return;const v=parseFloat(t),d=t.includes('.')?1:0,t0=performance.now();(function f(n){const p=Math.min(1,(n-t0)/700);b.textContent=p<1?(v*(1-Math.pow(1-p,3))).toFixed(d):t;if(p<1)requestAnimationFrame(f)})(t0)})}
function confetti(){if(reduced)return;let c=document.getElementById('cf');if(c)c.remove();c=document.createElement('canvas');c.id='cf';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d'),P=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-13-3,r:Math.random()*7+4,c:'hsl('+Math.random()*360+',85%,60%)',a:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++n<120)requestAnimationFrame(f);else c.remove()})()}
function ripple(b,e){const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height)*2;s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(()=>s.remove(),600)}
setInterval(()=>{const t=cdText();document.querySelectorAll('[data-cd]').forEach(e=>e.textContent=t);document.querySelectorAll('[data-sync]').forEach(e=>e.textContent=new Date(sync).toLocaleTimeString('ru-RU'));if(Object.keys(loaded).length===KEYS.length&&closedNow()!==wasClosed)render()},1000);

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const rb=e.target.closest('button.b');if(rb)ripple(rb,e);const t=e.target.closest('[data-tab],[data-del],[data-act],[data-eye],[data-gen],[data-rf],[data-sign],[data-theme-toggle],[data-copy],[data-preset],[data-impgo],[data-impno]');if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;LS.set('sch_tab_'+sess,tab);render()}
 else if(t.dataset.act==='out'){logout();render()}
 else if(t.hasAttribute('data-eye')){const i=t.previousElementSibling;i.type=i.type==='password'?'text':'password'}
 else if(t.hasAttribute('data-gen')){const f=t.closest('form'),c='abcdefghjkmnpqrstuvwxyz23456789';f.elements.pw.value=Array.from({length:8},()=>c[Math.floor(Math.random()*c.length)]).join('')}
 else if(t.dataset.rf){st.rf=t.dataset.rf;render()}
 else if(t.hasAttribute('data-theme-toggle')){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';r.dataset.theme=nx;LS.set('sch_theme',nx)}
 else if(t.hasAttribute('data-copy')){try{await navigator.clipboard.writeText(t.dataset.copy);toast('📋 Скопировано')}catch(x){toast(t.dataset.copy)}}
 else if(t.hasAttribute('data-impno')){imp=null;render()}
 else if(t.dataset.impgo){await impGo(t.dataset.impgo,me())}
 else if(t.hasAttribute('data-preset')){const m=t.closest('form').elements.msg;m.value=t.dataset.preset}
 else if(t.dataset.sign){const[n,w]=t.dataset.sign.split('|');if(await put('signs',n+'_'+w,{stu:n,wk:w,parent:sess,ts:Date.now()})){toast('✅ Дневник подписан');confetti()}}
 else if(t.dataset.del){const k=t.dataset.del;if(st.sure!==k){st.sure=k;render();setTimeout(()=>{if(st.sure===k){st.sure='';render()}},4000);return}
  st.sure='';const[c,id]=k.split(':');if(c==='users'){await del('auth',id);await del('secrets',id)}await del(c,id);render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-cls]')){st.cls=t.value;render()}else if(t.matches('[data-kid]')){st.kid=t.value;render()}else if(t.name==='role'&&t.form)applyRF()});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-shot]')&&t.files&&t.files[0]){shotImport(t.files[0],t.dataset.shot)}else if(t.matches('[data-imp]')&&imp)imp.rows[+t.dataset.imp].ok=t.checked});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.matches&&e.target.matches('[data-chat]')){e.preventDefault();if(e.target.form.reportValidity())e.target.form.requestSubmit()}});
document.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-fix]')){const v=t.value.replace(/[^A-Za-z0-9_.!@#]/g,'');if(v!==t.value)t.value=v}else if(t.matches('[data-q]')){st.q=t.value;render()}});
document.addEventListener('submit',async e=>{
 e.preventDefault();const f=e.target,k=f.dataset.f;if(!k)return;const fd=new FormData(f),d=Object.fromEntries(fd),u=me(),say=m=>{const x=document.getElementById('fe');if(x)x.textContent=m};
 if(k==='setup'){
  if(!(await canSetup())){say('Создать создателя может только владелец страницы в claude.ai.');return}
  const nick=d.nick.toLowerCase();if(!PWRE.test(d.pw)){say(PWHINT);return}
  if(await put('users',nick,{nick,name:d.name.trim(),role:'admin',cls:'',subject:'',kids:[]})){const h=await setPw(nick,d.pw);if(h){sess=nick;sessH=h;LS.set('sch_u',nick);LS.set('sch_h',h);confetti()}}
 }else if(k==='login'){
  const x=byNick(d.nick.trim().toLowerCase()),A=x&&(S.auth.find(a=>a.id===x.nick)||x);
  if(!x||!A.salt||(await hashPw(A.salt,d.pw))!==A.hash){say('Неверный логин или пароль');return}
  if(closedNow()&&!isAdm(x)){say('Сайт закрыт на технические работы. Зайдите позже.');return}
  sess=x.nick;sessH=A.hash;LS.set('sch_u',sess);LS.set('sch_h',sessH);tab=LS.get('sch_tab_'+x.nick);
 }else if(k==='adduser'){
  const nick=d.nick.toLowerCase(),kids=fd.getAll('kids');
  if(byNick(nick)){say('Такой логин уже занят');return}if(!PWRE.test(d.pw)){say(PWHINT);return}
  if(d.role==='student'&&!d.cls.trim()){say('Укажите класс ученика');return}if(d.role==='parent'&&!kids.length){say('Выберите хотя бы одного ребёнка');return}
  if(await put('users',nick,{nick,name:d.name.trim(),role:d.role,cls:d.role==='student'?d.cls.trim():'',subject:d.role==='teacher'?(d.subject||'').trim():'',kids:d.role==='parent'?kids:[]})&&await setPw(nick,d.pw)){toast('✅ Создан: '+nick+' / '+d.pw);f.reset()}
 }else if(k==='pw'){
  if(!PWRE.test(d.pw)){toast('⚠️ '+PWHINT);return}if(await setPw(f.dataset.nick,d.pw)){toast('✅ Пароль изменён');f.reset()}
 }else if(k==='mypw'){
  const A=S.auth.find(a=>a.id===u.nick)||u;if(!A.salt||(await hashPw(A.salt,d.old))!==A.hash){say('Старый пароль неверен');return}
  if(!PWRE.test(d.pw)){say(PWHINT);return}const h=await setPw(u.nick,d.pw);if(h){sessH=h;LS.set('sch_h',h);toast('✅ Пароль изменён');f.reset()}
 }else if(k==='addgrade'){
  if(await put('grades',uid(),{stu:d.stu,subject:d.subject.trim(),value:+d.v,comment:(d.comment||'').trim(),by:u.nick,ts:Date.now()})){toast('✅ Оценка '+d.v+' сохранена');if(+d.v>=9)confetti();f.querySelectorAll('input[type=radio]').forEach(r=>r.checked=false);f.comment.value=''}
 }else if(k==='addnote'){
  if(await put('notes',uid(),{stu:d.stu,type:d.type,text:d.text.trim(),by:u.nick,ts:Date.now()})){toast('✅ Запись добавлена');f.text.value=''}
 }else if(k==='addnews'){
  if(await put('news',uid(),{title:d.title.trim(),text:d.text.trim(),by:u.nick,ts:Date.now()}))f.reset()
 }else if(k==='addsched'){
  if(await put('sched',uid(),{cls:(u.role==='student'?u.cls:d.cls.trim()),day:+d.day,lesson:+d.lesson,subject:d.subject.trim(),room:(d.room||'').trim()})){st.cls=d.cls.trim();toast('✅ Урок добавлен')}
 }else if(k==='addhw'){
  if(await put('hw',uid(),{cls:(u.role==='student'?u.cls:d.cls.trim()),subject:d.subject.trim(),text:d.text.trim(),due:new Date(d.due+'T00:00:00').getTime(),by:u.nick,ts:Date.now()})){st.cls=d.cls.trim();toast('✅ Домашка добавлена');f.text.value=''}
 }else if(k==='addabs'){
  if(await put('abs',uid(),{stu:d.stu,date:new Date(d.date+'T00:00:00').getTime(),reason:d.reason,note:(d.note||'').trim(),by:u.nick,ts:Date.now()})){toast('✅ Пропуск отмечен');f.note.value=''}
 }else if(k==='setver'){
  const t=byNick(f.dataset.nick);if(t&&await put('users',t.nick,{...strip(t),v1:await sha(t.nick+':'+normA(d.a1)),v2:await sha(t.nick+':'+normA(d.a2)),esOk:0}))toast('✅ Вопросы для проверки сохранены')
 }else if(k==='link'){
  const lk=+LS.get('sch_lk_'+u.nick)||0;if(lk>Date.now()){say('Слишком много попыток. Подождите '+Math.ceil((lk-Date.now())/60000)+' мин.');return}
  const h1=await sha(u.nick+':'+normA(d.a1)),h2=await sha(u.nick+':'+normA(d.a2));
  if(h1!==u.v1||h2!==u.v2){const c=(+LS.get('sch_lkc_'+u.nick)||0)+1;LS.set('sch_lkc_'+u.nick,c);if(c>=3){LS.set('sch_lk_'+u.nick,Date.now()+6e5);LS.del('sch_lkc_'+u.nick);say('Три ошибки подряд. Связка заблокирована на 10 минут.');render()}else say('Ответы не совпали. Осталось попыток: '+(3-c));return}
  LS.del('sch_lkc_'+u.nick);if(await put('users',u.nick,{...strip(u),esl:d.esl.trim(),esOk:Date.now()})){toast('✅ Связка подтверждена');confetti()}
 }else if(k==='chat'){
  const c=classOf(u),tx=(d.text||'').trim();if(!c||!tx)return;if(Date.now()-(window.__lastMsg||0)<800)return;window.__lastMsg=Date.now();
  if(await put('chat',uid(),{cls:c,text:tx.slice(0,500),by:u.nick,ts:Date.now()}))f.text.value=''
 }else if(k==='setinfo'){
  const t=byNick(f.dataset.nick);if(t&&await put('users',t.nick,{...strip(t),...('cls' in d?{cls:d.cls.trim()}:{subject:d.subject.trim()})}))toast('✅ Сохранено')
 }else if(k==='maint'){
  const b=e.submitter&&e.submitter.value,o=strip(site());
  const nv=b==='off'?{...o,closed:false,until:0}:{...o,closed:true,msg:d.msg.trim()||'Ведутся технические работы.',until:+d.dur?Date.now()+(+d.dur)*60000:0,by:u.nick,since:Date.now()};
  if(await put('settings','site',nv))toast(b==='off'?'🔓 Сайт открыт для всех':'🔧 Техработы включены')
 }else if(k==='school'){
  if(await put('settings','site',{...strip(site()),school:d.school.trim(),place:(d.place||'').trim()||PLACE}))toast('✅ Сохранено')
 }
 render()});

/* ---------- start ---------- */
(async()=>{
 render();
 const to=setTimeout(()=>{if(Object.keys(loaded).length<KEYS.length){err='Не удалось загрузить данные. Проверьте интернет и обновите страницу.';render()}},12000);
 try{if(window.FB_CFG){firebase.initializeApp(window.FB_CFG);db=firebase.firestore()}else db=await claude.use('db')}catch(e){db=null}
 if(!db){clearTimeout(to);err='База данных недоступна. Откройте сайт по ссылке из аккаунта claude.ai (или проверьте настройки Firebase).';render();return}
 try{if(window.FB_CFG)myId='fb';else{const us=await claude.use('user');myId=us?await us.id():'x'}}catch(e){}
 KEYS.forEach(k=>db.collection(k).onSnapshot(s=>{
  const arr=s.docs.map(d=>({...d.data(),id:d.id})),sg=JSON.stringify(arr);sync=Date.now();
  if(loaded[k]&&sg===SIG[k])return;SIG[k]=sg;S[k]=arr;loaded[k]=1;
  if(k==='users')UM=new Map(arr.map(x=>[x.nick,x]));
  if(k==='grades'){GB=new Map();arr.forEach(g=>{if(!GB.has(g.stu))GB.set(g.stu,[]);GB.get(g.stu).push(g)})}
  if(Object.keys(loaded).length===KEYS.length)clearTimeout(to);schedule()},
  e=>{loaded[k]=1;if(k!=='secrets')err='Ошибка загрузки данных ('+k+')';schedule()}));
})();
</script>
