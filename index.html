function openQuick(cell){
const u=me();if(!canTeach(u))return;
const [subject,cls,targetDate]=cell.split('|');
const box=document.getElementById('quickbox');
const pick=Array.from({length:10},(_,i)=><label><input type="radio" name="v" value="${i+1}"><span class="gr ${gc(i+1)}">${i+1}</span></label>).join('');

const daysWithSubj=[...new Set(S.sched.filter(s=>s.cls===cls&&s.subject===subject).map(s=>+s.day))];
const today=new Date();today.setHours(0,0,0,0);
const currentDay=(today.getDay()+6)%7;
let dates=[];
daysWithSubj.forEach(d=>{let dt=new Date(today);dt.setDate(dt.getDate()+(d-currentDay));dates.push(dkey(dt))});
